name: Docker CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: Build and Test Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t activitymarker-app:${{ github.sha }} .
          docker build -t activitymarker-app:latest .

      - name: Run container
        run: docker run -d -p 8080:80 --name test-app activitymarker-app:latest

      - name: Wait for app to start
        run: sleep 5

      - name: Test application
        run: |
          echo "Testing if app is accessible..."
          curl -f http://localhost:8080
          
          echo "Checking for critical files..."
          docker exec test-app ls /usr/share/nginx/html/index.html

      - name: View logs
        if: always()
        run: docker logs test-app

      - name: Cleanup
        if: always()
        run: docker rm -f test-app

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Dockerfile best practices
        run: |
          echo "Checking Dockerfile..."
          if grep -q "FROM.*:latest" Dockerfile; then
            echo "Warning: Using 'latest' tag in Dockerfile"
          fi

      - name: List project structure
        run: |
          echo "Project structure:"
          tree -L 2 || find . -maxdepth 2 -type f

  deploy:
    name: Deploy to Production
    needs: [build-test, code-quality]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "Deploying to production CICD..."
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Message: ${{ github.event.head_commit.message }}"